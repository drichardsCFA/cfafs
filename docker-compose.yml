services:
  frontend:
    build:
      context: ./frontend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    working_dir: /app
    ports:
      - "8000:8000"

  chatbot:
    image: botpress/server:latest
    container_name: cfafs-chatbot
    environment:
      - BP_PRODUCTION=true
    ports:
      - "3001:3000"
    networks:
      - default

  faq:
    image: semitechnologies/weaviate:1.22.4
    container_name: cfafs-faq
    ports:
      - "8080:8080"
    environment:
      - QUERY_DEFAULTS_LIMIT=20
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/data
      - DEFAULT_VECTORIZER_MODULE=text2vec-transformers
      - TRANSFORMERS_INFERENCE_API=http://transformers:8080
      - ENABLE_MODULES=text2vec-transformers
    volumes:
      - ./faq/data:/data
    networks:
      - default

  transformers:
    image: semitechnologies/transformers-inference:sentence-transformers-paraphrase-multilingual-MiniLM-L12-v2
    environment:
      - ENABLE_CUDA=false
    ports:
      - "8082:8080"
    networks:
      - default
networks:
  default:
    name: cfafsnet
